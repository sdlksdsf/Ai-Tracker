# ---------------------------------------------------------------------------
# PlateMatch — local infrastructure
#
#   docker compose up -d          # start Postgres + Redis + MinIO
#   docker compose down           # stop everything
#   docker compose logs -f api    # tail logs
# ---------------------------------------------------------------------------
name: platematch

services:
  postgres:
    image: postgres:16-alpine
    container_name: platematch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platematch
      POSTGRES_PASSWORD: platematch
      POSTGRES_DB: platematch
      # Faster local dev; production tuning lives in the hosting provider.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platematch -d platematch']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: platematch-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage — lets you run the whole upload pipeline
  # locally without a Cloudinary account. Set STORAGE_DRIVER=s3 to use it.
  minio:
    image: minio/minio:latest
    container_name: platematch-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platematch
      MINIO_ROOT_PASSWORD: platematch123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
